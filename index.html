<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="description" content="Save and watch your favorite YouTube videos and channels — up to 5 links, right on your phone." />
  <meta property="og:title" content="My YouTube Favorites" />
  <meta property="og:description" content="Save up to 5 YouTube videos or channels and open them anytime." />
  <meta property="og:type" content="website" />
  <title>My YouTube Favorites</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo" aria-hidden="true">▶</div>
        <div>
          <h1>My YouTube Favorites</h1>
          <p class="subtitle"><span id="count-label">0 of 5 saved</span></p>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="empty-state" class="empty-state hidden" aria-live="polite">
        <div class="empty-icon" aria-hidden="true">🎬</div>
        <h2>No favorites yet</h2>
        <p>Add your favorite YouTube videos or channels (up to 5). Paste a youtube.com, youtu.be, or @channel link below.</p>
      </section>

      <section id="video-list" class="video-list" aria-label="Saved favorites"></section>

      <section id="form-section" class="form-section">
        <h2 id="form-title" class="form-title">Add a YouTube link</h2>
        <form id="add-form" autocomplete="off" novalidate>
          <label class="sr-only" for="url-input">YouTube URL</label>
          <input
            id="url-input"
            type="text"
            inputmode="url"
            placeholder="Video, Shorts, youtu.be, or youtube.com/@channel"
            required
            aria-describedby="url-hint"
          />
          <p id="url-hint" class="hint">Videos, Shorts, youtu.be, and channels (/@name, /channel/…, /c/…, /user/…).</p>
          <p id="form-error" class="error hidden" role="alert"></p>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add favorite</button>
            <button type="button" id="cancel-edit" class="btn btn-ghost hidden">Cancel</button>
          </div>
        </form>
      </section>
    </main>

    <div id="player-overlay" class="player-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="player-sheet">
        <div class="player-top">
          <h3 id="player-title" class="player-title">Watching</h3>
          <button type="button" id="close-player" class="btn-icon" aria-label="Close">✕</button>
        </div>
        <div class="player-frame-wrap">
          <iframe
            id="player-iframe"
            title="YouTube video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <div id="channel-panel" class="channel-panel hidden">
          <img id="channel-panel-thumb" class="channel-panel-thumb" alt="" />
          <div>
            <p id="channel-panel-name" class="channel-panel-name"></p>
            <p id="channel-panel-hint" class="channel-panel-hint"></p>
          </div>
        </div>
        <a id="open-yt" class="btn btn-secondary" href="#" target="_blank" rel="noopener noreferrer">Open on YouTube ↗</a>
      </div>
    </div>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
